<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обратный отсчет</title>
    <link
      href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700;900&family=UnifrakturMaguntia&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Cinzel", serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        background-color: #0a0505;
      }

      .bosch-bg {
        position: fixed;
        inset: 0;
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/The_Garden_of_earthly_delights.jpg/1920px-The_Garden_of_earthly_delights.jpg");
        background-size: cover;
        background-position: center 30%;
        filter: saturate(0.7) brightness(0.45) sepia(0.3);
        z-index: 0;
      }

      .bosch-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.1) 0%,
          rgba(10, 3, 3, 0.7) 100%
        );
        z-index: 1;
      }

      /* Floating dark creatures */
      .creatures {
        position: fixed;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }

      .creature {
        position: absolute;
        font-size: 2em;
        opacity: 0;
        animation: drift 20s infinite;
        filter: drop-shadow(0 0 6px rgba(200, 80, 0, 0.7));
      }

      @keyframes drift {
        0% {
          opacity: 0;
          transform: translateY(110vh) translateX(0) rotate(0deg);
        }
        10% {
          opacity: 0.7;
        }
        90% {
          opacity: 0.5;
        }
        100% {
          opacity: 0;
          transform: translateY(-10vh) translateX(80px) rotate(30deg);
        }
      }

      .container {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: 50px 60px;
        background: rgba(5, 2, 2, 0.72);
        backdrop-filter: blur(6px);
        border-radius: 4px;
        border: 1px solid rgba(160, 80, 20, 0.6);
        box-shadow:
          0 0 60px rgba(180, 60, 0, 0.3),
          inset 0 0 40px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(80, 30, 0, 0.8);
        animation: flicker 8s ease-in-out infinite;
        max-width: 800px;
        width: 90vw;
      }

      @keyframes flicker {
        0%,
        100% {
          box-shadow:
            0 0 60px rgba(180, 60, 0, 0.3),
            inset 0 0 40px rgba(0, 0, 0, 0.5);
        }
        45% {
          box-shadow:
            0 0 80px rgba(200, 80, 0, 0.5),
            inset 0 0 50px rgba(0, 0, 0, 0.3);
        }
        50% {
          box-shadow:
            0 0 40px rgba(150, 40, 0, 0.2),
            inset 0 0 30px rgba(0, 0, 0, 0.7);
        }
        55% {
          box-shadow:
            0 0 80px rgba(200, 80, 0, 0.5),
            inset 0 0 50px rgba(0, 0, 0, 0.3);
        }
      }

      /* Decorative border corners */
      .container::before,
      .container::after {
        content: "✦";
        position: absolute;
        color: rgba(200, 100, 20, 0.7);
        font-size: 1.5em;
      }
      .container::before {
        top: 12px;
        left: 18px;
      }
      .container::after {
        bottom: 12px;
        right: 18px;
      }

      h1 {
        font-family: "UnifrakturMaguntia", cursive;
        font-size: 3.2em;
        margin-bottom: 10px;
        color: #d4882a;
        text-shadow:
          0 0 20px rgba(220, 120, 0, 0.8),
          0 0 60px rgba(200, 80, 0, 0.4),
          2px 2px 0px #1a0800;
        letter-spacing: 2px;
        animation: glow 3s ease-in-out infinite;
      }

      @keyframes glow {
        0%,
        100% {
          text-shadow:
            0 0 20px rgba(220, 120, 0, 0.8),
            0 0 60px rgba(200, 80, 0, 0.4),
            2px 2px 0px #1a0800;
        }
        50% {
          text-shadow:
            0 0 30px rgba(255, 160, 40, 1),
            0 0 80px rgba(220, 80, 0, 0.7),
            2px 2px 0px #1a0800;
        }
      }

      .subtitle {
        font-size: 0.85em;
        color: rgba(180, 120, 60, 0.8);
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .divider {
        width: 80%;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(180, 80, 10, 0.8),
          transparent
        );
        margin: 18px auto;
      }

      .date-display {
        margin-bottom: 8px;
        font-size: 1.15em;
        font-weight: 700;
        color: #b87030;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(200, 100, 0, 0.5);
      }

      .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 35px;
        flex-wrap: wrap;
      }

      .time-unit {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .number {
        font-family: "Cinzel", serif;
        font-size: 4.2em;
        font-weight: 900;
        color: #e8a040;
        min-width: 120px;
        padding: 22px 16px;
        background: rgba(10, 3, 0, 0.8);
        border: 1px solid rgba(160, 70, 10, 0.5);
        border-radius: 2px;
        text-shadow:
          0 0 15px rgba(230, 140, 30, 0.9),
          0 0 40px rgba(200, 80, 0, 0.5);
        box-shadow:
          inset 0 0 20px rgba(0, 0, 0, 0.6),
          0 0 15px rgba(150, 60, 0, 0.2);
        transition: transform 0.3s ease;
        position: relative;
      }

      .number::before,
      .number::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        border: 1px solid rgba(180, 80, 10, 0.7);
      }
      .number::before {
        top: 5px;
        left: 5px;
        border-right: none;
        border-bottom: none;
      }
      .number::after {
        bottom: 5px;
        right: 5px;
        border-left: none;
        border-top: none;
      }

      .number:hover {
        transform: scale(1.06);
        text-shadow:
          0 0 25px rgba(255, 160, 40, 1),
          0 0 60px rgba(220, 80, 0, 0.7);
      }

      .label {
        font-size: 0.75em;
        margin-top: 12px;
        text-transform: uppercase;
        letter-spacing: 4px;
        font-weight: 700;
        color: rgba(160, 90, 30, 0.9);
      }

      #finished-msg {
        display: none;
        font-family: "UnifrakturMaguntia", cursive;
        font-size: 2.8em;
        color: #e8a040;
        text-shadow:
          0 0 30px rgba(255, 140, 0, 1),
          0 0 80px rgba(200, 80, 0, 0.8);
        animation: glow 1.5s ease-in-out infinite;
        margin-top: 20px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 30px 20px;
        }
        h1 {
          font-size: 2.2em;
        }
        .number {
          font-size: 2.8em;
          min-width: 75px;
          padding: 16px 10px;
        }
        .label {
          font-size: 0.65em;
          letter-spacing: 2px;
        }
        .countdown {
          gap: 12px;
        }
        .date-display {
          font-size: 0.95em;
        }
      }

      @media (max-width: 430px) {
        h1 {
          font-size: 1.8em;
        }
        .number {
          font-size: 2em;
          min-width: 60px;
          padding: 12px 8px;
        }
        .label {
          font-size: 0.6em;
        }
        .countdown {
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bosch-bg"></div>
    <div class="bosch-overlay"></div>

    <div class="creatures" id="creatures"></div>

    <div class="container">
      <div class="subtitle">✦ &nbsp; Тайное исчисление &nbsp; ✦</div>
      <h1>эта ебанина закончится через</h1>
      <div class="divider"></div>

      <div class="countdown" id="countdown-wrap">
        <div class="time-unit">
          <div class="number" id="days">00</div>
          <div class="label">Дней</div>
        </div>
        <div class="time-unit">
          <div class="number" id="hours">00</div>
          <div class="label">Часов</div>
        </div>
        <div class="time-unit">
          <div class="number" id="minutes">00</div>
          <div class="label">Минут</div>
        </div>
        <div class="time-unit">
          <div class="number" id="seconds">00</div>
          <div class="label">Секунд</div>
        </div>
      </div>

      <div class="divider" style="margin-top: 28px;"></div>
      <div class="date-display">V · Июня · MMXXVI · XIX:00</div>

      <div id="finished-msg">⚗ Час настал ⚗</div>
    </div>

    <script>
      // Floating dark emoji creatures from Bosch-like imagery
      const creaturesContainer = document.getElementById("creatures");
      const symbols = [
        "🦇",
        "🐍",
        "🦎",
        "🕷",
        "🦂",
        "🐸",
        "🔮",
        "⚗️",
        "💀",
        "🕯",
        "🌑",
        "🦅",
        "🌿",
        "🍄",
      ];

      for (let i = 0; i < 30; i++) {
        const el = document.createElement("div");
        el.className = "creature";
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + "%";
        el.style.animationDelay = Math.random() * 20 + "s";
        el.style.animationDuration = Math.random() * 12 + 14 + "s";
        el.style.fontSize = 1.2 + Math.random() * 1.8 + "em";
        creaturesContainer.appendChild(el);
      }

      // Countdown to June 5, 2026, 19:00
      function updateCountdown() {
        const targetDate = new Date("2026-06-05T19:00:00").getTime();
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor(
            (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
          );
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          document.getElementById("days").textContent = String(days).padStart(
            2,
            "0",
          );
          document.getElementById("hours").textContent = String(hours).padStart(
            2,
            "0",
          );
          document.getElementById("minutes").textContent = String(
            minutes,
          ).padStart(2, "0");
          document.getElementById("seconds").textContent = String(
            seconds,
          ).padStart(2, "0");
        } else {
          document.getElementById("countdown-wrap").style.display = "none";
          document.getElementById("finished-msg").style.display = "block";
        }
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
